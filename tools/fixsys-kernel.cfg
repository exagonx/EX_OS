# =============================================================================
# /boot/kernel.cfg del DISCHETTO DI SOCCORSO (dist/fixsys.img)
#
# ! E' UN FILE A PARTE, E NON UNA COPIA DI QUELLO DI SISTEMA. Quello nomina
# cose che su questo dischetto non ci sono — a cominciare da /bin/login — e un
# modulo che manca non e' gratis: il kernel lo salta con un avviso, e se quel
# modulo e' `kbd` la tastiera resta senza disciplina di linea. Il sintomo, visto
# su una macchina vera il 15 settembre 2026, e' una shell che accetta i
# caratteri e non esegue MAI: si scrive, si batte invio, e non succede niente.
# =============================================================================

[kernel]
loglevel    = 3
timer_hz    = 100
verboseboot = 0
keymap      = us

[boot]
# ! SI ENTRA DIRITTI NELLA SHELL, SENZA ACCESSO. Questo e' un disco di
# soccorso: chiedere una password per riparare una macchina che non parte
# vorrebbe dire chiedere la password di un archivio che sta sul disco rotto.
shell       = /bin/sh

# ! I TRE DRIVER DELLA TASTIERA, E IL PERCHE' STA IN boot/kernel.cfg PER
# ESTESO. Su una scheda madre senza supporto legacy la tastiera e' USB e basta:
# l'8042 non c'e', kbd.drv non riceve niente, e NESSUNO PUO' BATTERE IL COMANDO
# che avvierebbe il driver USB — perche' e' proprio la tastiera che quel driver
# deve far funzionare. Su un disco di soccorso quel caso non si puo' lasciare
# scoperto: qui dentro c'e' spazio, e i tre driver ci stanno.
modules     = kbd, pci, uhci

[modules]
kbd         = /dev/kbd.drv
pci         = /dev/pci.drv
uhci        = /dev/uhci.drv

# ! NIENTE MONTAGGI AUTOMATICI. Il disco da riparare lo monta `fixsys.sh`,
# quando glielo si dice, dopo aver guardato con `disk` che sia quello giusto.
# Montarlo da solo all'avvio vorrebbe dire scriverci sopra prima di aver
# deciso niente.
[mount]
