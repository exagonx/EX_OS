#
# Bersaglio OpenSSL per EX-OS. Va copiato in openssl/Configurations/ prima
# di lanciare Configure — lo fa prepara-openssl.sh.
#
# -----------------------------------------------------------------------------
# ! SI EREDITA DA BASE_unix E NON DA BASE_generic
#
# EX-OS non e' Unix, ma la sua libc e' quella: percorsi con la barra,
# open/read/write/close, errno. BASE_generic vorrebbe dire riscrivere da
# zero la descrizione di come si costruisce un programma, per poi
# riottenere quella di Unix.
#
# -----------------------------------------------------------------------------
# ! NIENTE ASSEMBLY OTTIMIZZATO (asm_arch vuoto, e non e' pigrizia)
#
# Il perlasm di OpenSSL per x86 emette codice che presuppone SSE2 e, in
# alcune varianti, AVX. EX-OS deve partire anche su un 486: un binario
# compilato con quelle istruzioni non da' un errore di compilazione, da'
# un'istruzione illegale al primo handshake, su una macchina dove tutto il
# resto funziona.
#
# Il prezzo e' dichiarato: AES e SHA in C puro sono parecchie volte piu'
# lenti. Su questo hardware la differenza fra «lento» e «lentissimo»
# conta meno di quella fra «parte» e «non parte».
#
# -----------------------------------------------------------------------------
# ! thread_scheme "(unknown)" E' UNA DICHIARAZIONE, NON UN RIPIEGO
#
# EX-OS non ha i thread e non li avra' presto. Dichiararlo qui fa
# scegliere a OpenSSL le vie senza blocchi invece di farle fallire a
# runtime — che e' il modo in cui una libreria crittografica diventa
# insicura senza dirlo.
# =============================================================================

my %targets = (
    "exos-x86" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "i386-exos-gcc",
        AR               => "i386-exos-ar",
        RANLIB           => "i386-exos-ranlib",

        # -DL_ENDIAN: x86 e' little endian, e dirlo evita che OpenSSL lo
        # deduca da una prova che qui non puo' girare.
        # -DOPENSSL_NO_SECURE_MEMORY: la memoria "sicura" di OpenSSL vuole
        # mmap con MAP_LOCKED e mprotect, che qui non ci sono. Dichiararlo
        # e' meglio di lasciargliene scoprire l'assenza.
        CFLAGS           => "-O2 -Wall",
        # ! -DNO_SYSLOG usa L'INTERRUTTORE DI OpenSSL, non una patch.
        # bss_log.c (il BIO che scrive nel log di sistema) include
        # <syslog.h> a meno che NO_SYSLOG non sia definito — e' la stessa
        # via che usano WASI e DJGPP. EX-OS non ha un log di sistema, e
        # inventargli un syslog.h vuoto per far compilare un BIO che
        # nessuno usera' sarebbe aggiungere superficie per niente.
        cflags           => "-DL_ENDIAN -DOPENSSL_NO_SECURE_MEMORY"
                            . " -DOPENSSL_NO_APPLINK -DNO_SYSLOG",

        sys_id           => "EXOS",
        bn_ops           => "BN_LLONG",

        # Nessun assembly: vedi sopra.
        asm_arch         => '',

        thread_scheme    => "(unknown)",

        # Niente librerie dinamiche: EX-OS carica solo ET_EXEC statici.
        dso_scheme       => "",
        shared_target    => "",
    },
);
