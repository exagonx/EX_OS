<html><head><title>video</title></head><body style="font-family: sans-serif; font-size: 13px">
<h1>&lt;video&gt; (P13)</h1>
<video id="v" src="prova.webm" width="320" height="240" autoplay></video>
<div id="r">in corso...</div>
<script>
var v = document.getElementById('v'), ev = [];
['loadstart', 'loadedmetadata', 'canplay', 'play', 'playing', 'ended', 'error'].forEach(function (k) {
  v.addEventListener(k, function () { ev.push(k); mostra(); });
});
function mostra() {
  document.getElementById('r').innerHTML = 'eventi: ' + ev.join(' ') + '<br>videoWidth ' + v.videoWidth + ' x ' + v.videoHeight +
    ', durata ' + (Math.round(v.duration * 10) / 10) + ', t ' + (Math.round(v.currentTime * 10) / 10) + ', paused ' + v.paused +
    '<br>canPlayType webm: ' + v.canPlayType('video/webm; codecs="vp8, opus"');
}
setInterval(mostra, 500);
</script></body></html>
