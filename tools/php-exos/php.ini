; /exos/php/etc/php.ini - PHP on EX-OS
;
; Read by bin/php and by mod_php inside httpd (PHPIniDir is not needed: the
; path is built in). Everything not written here is PHP's default.

[PHP]
memory_limit = 128M
max_execution_time = 30
error_reporting = E_ALL
display_errors = Off
log_errors = On
; to Apache's error_log under httpd, to the terminal under bin/php
error_log =
post_max_size = 8M
upload_max_filesize = 2M
default_charset = "UTF-8"
date.timezone = UTC
; EX-OS has no /tmp: PHP's temporary files, sessions and uploads go here
sys_temp_dir = "/exos/php/tmp"
upload_tmp_dir = "/exos/php/tmp"

[Session]
session.save_path = "/exos/php/tmp"

[mysqlnd]
; persistent connections are kept per thread of httpd's worker MPM
mysqli.allow_persistent = On
pdo_mysql.default_socket =

[opcache]
; compiled scripts kept in memory: one process, shared by all the threads
opcache.enable = 1
; its lock file (the default is /tmp)
opcache.lockfile_path = "/exos/php/tmp"
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
