# =============================================================================
# httpd-exos.conf - Apache httpd 2.4 on EX-OS: the smallest configuration
#
# Copyright (C) 2026 Graziano Falcone <exagonx@hotmail.com>
# SPDX-License-Identifier: GPL-2.0-or-later
#
# Every module is inside the program (no LoadModule). EX-OS has no fork():
# httpd runs as ONE process with the worker MPM, so it is started with -X:
#
#     /exos/apache2/bin/httpd -X -d /exos/apache2 -f conf/httpd-exos.conf &
#     /exos/apache2/bin/httpd -k stop -d /exos/apache2 -f conf/httpd-exos.conf
#
# tools/prova_httpd.sh uses this file with /a/apache2 in place of /exos/apache2.
# =============================================================================
ServerRoot "/exos/apache2"
Listen 80
ServerName exos.local
ServerAdmin root@localhost

# started as root: the threads that serve run as this user (numeric: no
# entry needed in /boot/utenti); Apache refuses to serve as root
User #100
Group #100

PidFile logs/httpd.pid
ErrorLog logs/error_log
LogLevel info
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog logs/access_log common

# one process: all the connections are its threads. Since kernel 0.282 a
# program has no fixed number of threads: the ceiling is the system's
# (every thread has 128 KB of kernel stack below 64 MB: about 450 tasks in
# all, fewer with little RAM; `procmax` in kernel.cfg can set it lower).
# Raise these three together for a busier server.
ThreadLimit 256
ThreadsPerChild 256
MaxRequestWorkers 256
MaxConnectionsPerChild 0
EnableSendfile off

TypesConfig conf/mime.types
DirectoryIndex index.html

# PHP (mod_php, built into httpd when tools/php-exos was built first): .php
# files go to it, index.php is an index too. Its settings are in
# /exos/php/etc/php.ini.
<IfModule php_module>
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
    DirectoryIndex index.php index.html
</IfModule>

DocumentRoot "/exos/apache2/htdocs"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/exos/apache2/htdocs">
    Options Indexes
    Require all granted
</Directory>

# The pictures of the Stamp key (/bin/cattura), to look at them from another
# machine: http://address/schermate/
# ! NOT FOR THE WHOLE WORLD: a picture of the desktop shows whatever was open.
Alias /schermate "/root/Images"
<Directory "/root/Images">
    Options Indexes
    Require ip 127 10 172.16.0.0/12 192.168
</Directory>

ScriptAlias /cgi-bin/ "/exos/apache2/cgi-bin/"
<Directory "/exos/apache2/cgi-bin">
    Options None
    Require all granted
</Directory>

<Location /server-status>
    SetHandler server-status
    Require ip 127.0.0.1
</Location>
