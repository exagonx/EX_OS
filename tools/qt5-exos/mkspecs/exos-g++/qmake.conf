#
# One mkspec for both targets: EXOS_T in the environment says which cross
# compiler (x86_64-exos by default, i386-exos for 32 bit), as
# tools/qt5-exos/costruisci.sh sets it.
#
# ! -D__unix__ -DEXOS_SOLO_POSIX, as every library ported to EX-OS: the
# EX-OS gcc defines __exos__ only (Qt knows it as Q_OS_EXOS, see
# tools/qt5-exos/applica.py), and EXOS_SOLO_POSIX keeps the libc's own
# names out of the way of the programs.

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

EXOS_T = $$(EXOS_T)
isEmpty(EXOS_T): EXOS_T = x86_64-exos
EXOS_MARCH = $$(EXOS_MARCH)

include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

QMAKE_CC                = $${EXOS_T}-gcc
QMAKE_CXX               = $${EXOS_T}-g++
QMAKE_LINK              = $${EXOS_T}-g++
QMAKE_LINK_SHLIB        = $${EXOS_T}-g++
QMAKE_LINK_C            = $${EXOS_T}-gcc
QMAKE_LINK_C_SHLIB      = $${EXOS_T}-gcc
QMAKE_AR                = $${EXOS_T}-ar cqs
QMAKE_OBJCOPY           = $${EXOS_T}-objcopy
QMAKE_NM                = $${EXOS_T}-nm -P
QMAKE_RANLIB            =
QMAKE_STRIP             = $${EXOS_T}-strip
QMAKE_STRIPFLAGS_LIB   += --strip-unneeded

QMAKE_CFLAGS           += $$EXOS_MARCH -D__unix__ -DEXOS_SOLO_POSIX
QMAKE_CXXFLAGS         += $$EXOS_MARCH -D__unix__ -DEXOS_SOLO_POSIX
QMAKE_CFLAGS_THREAD    += -pthread
QMAKE_CXXFLAGS_THREAD  += -pthread
QMAKE_LFLAGS_THREAD    += -pthread
QMAKE_LFLAGS_GCSECTIONS = -Wl,--gc-sections
# $ORIGIN works: lib/libc_dl.c reads DT_RUNPATH with it
QMAKE_LFLAGS_REL_RPATH  = -Wl,-z,origin
QMAKE_REL_RPATH_BASE    = $ORIGIN

QMAKE_INCDIR            =
QMAKE_LIBDIR            =
QMAKE_LIBS              =
QMAKE_LIBS_DYNLOAD      = -ldl
QMAKE_LIBS_THREAD       = -lpthread
QMAKE_LIBS_EGL          =
QMAKE_LIBS_OPENGL       =

load(qt_config)
QMAKE_PLATFORM         += exos
