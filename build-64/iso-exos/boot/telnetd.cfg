# =============================================================================
# /boot/telnetd.cfg — chi puo' entrare, da dove, e con che cosa
#
# Una riga per voce, "chiave = valore". Il cancelletto commenta.
# Le liste si separano con la virgola. Una lista VUOTA vuol dire "nessun
# filtro": e' il valore predefinito, ed e' quello permissivo — chi accende
# telnetd senza leggere questo file deve trovarlo scritto qui sopra.
#
# ! IL FILE SI LEGGE A OGNI CONNESSIONE, non solo all'avvio. Cambiare una
# regola non deve voler dire fermare il servizio: chi ha appena scoperto che
# sta entrando qualcuno che non dovrebbe, corregge il file e la connessione
# dopo e' gia' regolata.
# =============================================================================

# Che cosa se ne fa /boot/avvio.sh all'accensione.
#
# ! QUESTA RIGA E' L'INTERRUTTORE, e sta qui e non nello script perche' lo
# script lo riscrive `hwconfig` alla prima configurazione dell'hardware: una
# riga aggiunta la' sparisce senza dire niente. In /boot/avvio.sh c'e' sempre
# `telnetd -auto &`, che senza questa chiave esce in silenzio.
#
#   no      non parte. E' il predefinito, anche se il file non c'e'.
#   login   parte e chiede nome e password.
#   root    parte e da' una shell da amministratore SENZA CHIEDERE NIENTE.
#
# ! «root» VUOL DIRE CHE CHIUNQUE ARRIVI ALLA PORTA 23 E' AMMINISTRATORE.
# Per guidare da un'altra stanza una macchina di casa e' quel che serve; su
# una rete non propria e' una porta spalancata — e telnet e' in chiaro
# comunque, password compresa. La riga `da` qui sotto e' il modo di stringerla.
avvio   = no

# La porta su cui ascoltare. 23 e' quella di telnet.
porta   = 23

# Che cosa si lancia sulla sessione.
#
# ! CON /bin/login SI ENTRA CON NOME E PASSWORD; con /bin/sh si entra e basta.
# La seconda e' comoda per provare e non va lasciata accesa: chiunque arrivi
# alla porta ha una shell.
shell   = /bin/login

# Chi puo' entrare. Vuoto = chiunque abbia una password valida.
#utenti  = root, mario

# Chi NON puo' entrare, comunque. Vince sulla riga sopra.
#
# ! ROOT DA REMOTO E' LA PRIMA COSA CHE SI PROVA, e negarlo qui costa una
# riga: si entra come utente normale e si diventa root da dentro.
#nega    = root

# Da dove. Vuoto = da qualunque indirizzo. Si scrivono indirizzi singoli
# oppure reti in forma a.b.c.d/bit.
#
#   da = 10.0.0.0/24, 192.168.1.7
#
# ! VUOTO DI PREDEFINITO, E NON «10.0.0.0/24» COM'ERA. Quella rete e' quella
# che QEMU da' alla macchina virtuale: su un computer vero l'indirizzo arriva
# dal router di casa ed e' quasi sempre 192.168.qualcosa, cosi' telnetd
# rifiutava in silenzio ogni connessione e la riga che lo spiegava stava
# nell'ultimo rigo di un file che nessuno apre. Una porta che non si apre mai
# non e' piu' sicura di una filtrata: e' solo piu' difficile da capire.
#da     = 192.168.0.0/24
