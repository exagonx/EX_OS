[kernel]
loglevel  = 3
timer_hz  = 100

# verboseboot: 1 (default) mostra il log di avvio e i banner di kernel e
# shell; 0 avvia in silenzio — resta solo la riga di identità del sistema
# e l'output normale dei programmi.
#
# Il valore predefinito è 1 e vale in TUTTI i casi dubbi: voce assente,
# valore vuoto, valore non numerico. Solo uno ZERO esplicito zittisce il
# sistema. Il default è impostato prima ancora di leggere questo file,
# quindi vale anche se il file manca o è illeggibile.
#
# Cosa NON viene nascosto con 0: avvisi ed errori. Un boot muto che
# nasconde un fallimento sarebbe peggio di un boot rumoroso. Nel dettaglio:
#   - un LOG_ERROR viene stampato sempre, qualunque sia loglevel;
#   - ogni ERROR/WARN e' registrato mentre viene emesso e riproposto dopo
#     la pulizia dello schermo, cosi' i problemi dei PASSI 1-13 non
#     spariscono insieme al log di avvio;
#   - la console seriale riceve comunque tutto, filtro incluso.
#
# Nota: i messaggi dei PASSI 1-13 vengono emessi comunque, perché sono
# stampati PRIMA che questo file sia leggibile (serve FAT12, che parte al
# PASSO 13). Con verboseboot=0 il kernel li cancella dallo schermo al
# PASSO 13c invece di sopprimerli — vedi kernel_main.c.
verboseboot = 1

# Variabili d'ambiente ereditate dai processi utente (la shell le legge
# con SYS_GETENV all'avvio).
#
# OSNAME, OSVER e AUTHOR NON vanno messi qui: sono iniettati dal kernel a
# partire da kernel/include/version.h, che è la fonte unica di verità, e
# un valore scritto in questo file verrebbe comunque sovrascritto. La
# ragione è che `ver` legge la variabile globale del kernel mentre
# `uname` ed `env` leggono l'ambiente: se le due sorgenti potessero
# divergere, il sistema riporterebbe versioni diverse di sé stesso a
# seconda del comando. In più la versione si incrementa a ogni modifica
# del kernel, e questo file — che vive sul floppy e non viene
# ricompilato — non può esserne la fonte.
[env]
PATH      = /bin:/dev
HOME      = /
TERM      = vga

[boot]
shell     = /bin/sh
modules   = kbd

# I moduli elencati qui sono caricati al PASSO 14b di kernel_main come
# PROCESSI RING3 autonomi (elf_load + proc_set_ready), non come moduli
# kernel-space. Devono quindi essere eseguibili ET_EXEC statici, come i
# programmi di /bin.
#
# Storia di questa sezione (luglio 2026) — perché non c'è più 'tty' e non
# c'è ancora 'floppy':
#
#   tty     — non è mai esistito un /dev/tty.drv: drivers/tty/tty.c è
#             compilato DENTRO il kernel (vedi $(BUILD_KERNEL)/tty.o nel
#             Makefile) e inizializzato al PASSO 14. La voce era rimasta
#             qui da una fase precedente e produceva a ogni boot un
#             [WARN] "non caricato" del tutto fuorviante.
#   floppy  — drivers/floppy/floppy.c è ancora un modulo ET_DYN scritto
#             contro i simboli del kernel (port_inb/outb diretti, klog,
#             irq_register_handler): elf_load lo rifiuta con "tipo non
#             supportato (type=3)" e comunque prenderebbe #GP in ring3.
#             L'accesso al floppy resta fatto dal FAT12/FDC interno al
#             kernel. Va rimesso qui solo dopo averlo riscritto contro
#             l'API syscall, come è stato fatto per kbd.
#   kbd     — primo driver realmente migrato a ring3: usa SYS_IOPORT_*,
#             SYS_IRQ_BIND e SYS_IPC_* e non chiama un solo simbolo del
#             kernel. Vedi drivers/kbd/kbd.c.
[modules]
kbd       = /dev/kbd.drv

# Montaggi automatici, applicati al PASSO 13d — dopo il rilevamento dei
# dischi (13a) e la lettura di questo file (13b), perché prima di allora i
# dispositivi non esistono ancora.
#
# La forma è  punto = dispositivo, con il PUNTO a sinistra: è lui la
# chiave, e due dispositivi sullo stesso punto sarebbero un conflitto.
#
# Nomi dei dispositivi, come li elenca `disk`:
#   fd0      il floppy
#   hd0      il primo disco ATA, intero
#   hd0p1    la sua prima partizione
#
# La numerazione delle partizioni è quella di fdisk: 1-4 sono gli slot
# delle primarie anche se qualcuno è vuoto, le logiche partono da 5. Un
# disco con gli slot 1 e 3 occupati dà quindi hd0p1 e hd0p3, non p1 e p2.
#
# Il punto di montaggio NON deve esistere sul floppy: è virtuale, e
# compare nell'elenco della root perché lo aggiunge il VFS. Montare su un
# nome già esistente viene rifiutato invece di nasconderlo in silenzio.
#
# Un montaggio che fallisce non ferma l'avvio: viene segnalato con un
# [WARN] e il sistema prosegue. Un disco assente o cambiato non deve
# rendere il sistema non avviabile.
#
# I montaggi sono in LETTURA/SCRITTURA. Per montare senza permettere
# modifiche si aggiunge ",ro" al dispositivo:
#     /dati = hd0p2,ro
#
# Esempio, commentato perché dipende dal disco presente. Provato
# funzionante il 2026-07-31 su un disco con hd0p1 FAT12: togliendo il
# cancelletto il montaggio avviene al PASSO 13d, e se il disco non c'è
# compare un [WARN] e l'avvio prosegue.
[mount]
# /disk  = hd0p1
