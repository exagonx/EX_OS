# Formato INI: sezioni [nome], coppie chiave=valore, commenti con #
#
# !! QUI STANNO SOLO LE IMPOSTAZIONI. La spiegazione di ognuna - cosa fa,
# cosa succede se manca, quali valori sono ammessi e perche' - sta in
# /boot/kernel.txt, che il kernel NON legge e puo' quindi crescere quanto
# serve. Questo file ha un tetto di 8191 byte: oltre, le sezioni finali
# vengono ignorate e la macchina si presenta senza tastiera.
# =============================================================================

[kernel]
loglevel    = 3
timer_hz    = 100

# 0 = avvio silenzioso (default), 1 = mostra il log di avvio
verboseboot = 0

# Disposizione della tastiera: us, it, fr, de, es, uk
keymap      = us

# Risoluzione della console. La scrive `/dev/svga.drv <modo>`, la impone
# Stage 2. Assente = console di testo 80x25.
# svga      = 800x600

# Variabili ereditate dai processi utente.
# !! OSNAME, OSVER e AUTHOR NON vanno messi qui: li inietta il kernel.
[env]
PATH        = /bin:/dev:/cdrom/exos/bin:/cdrom/bin
HOME        = /
TERM        = vga

[boot]
shell       = /bin/sh

# login: chiede utente e password, e `exit` torna al prompt d'accesso.
# Utenti in /boot/utenti. Provato funzionante il 10 agosto 2026; resta
# spento perche' accendendolo ogni prova automatica va autenticata.
# login     = /bin/login

modules     = kbd

# Driver caricati come processi ring3. Nome = percorso dell'eseguibile.
# !! /dev/svga.drv NON va qui: e' uno strumento che si lancia a mano, non un
# processo da tenere vivo.
[modules]
kbd         = /dev/kbd.drv

# !! SU UNA SCHEDA MADRE SENZA SUPPORTO LEGACY la tastiera e' USB e basta:
# l'8042 non c'e', quindi kbd.drv non riceve niente e NESSUNO PUO' BATTERE IL
# COMANDO che avvia il driver USB — e' la tastiera che quel driver deve far
# funzionare. Va quindi caricato all'avvio, insieme al PCI da cui dipende:
#
#   modules     = kbd, pci, uhci
#   pci         = /dev/pci.drv
#   uhci        = /dev/uhci.drv
#
# I tre driver stanno SUL FLOPPY dal 13 agosto 2026, apposta per questo caso:
# una macchina senza 8042 che si avvia da floppy deve trovarci dentro tutto
# quello che le serve per avere una tastiera, senza dipendere dal CD.
# Un modulo assente viene saltato con un avviso, quindi lasciare le righe
# non rompe niente su una macchina che la tastiera legacy ce l'ha.

# Montaggi automatici: punto = dispositivo (fd0, hd0, hd0p1, cd0).
# Aggiungere ",ro" al dispositivo per la sola lettura.
[mount]
/cdrom = cd0
# /disk  = hd0p1
